version: 2

updates:
  # Keep tag refs rather than commit SHAs: the Ruff step in ci.yml reads the super-linter tag
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    assignees:
      - mattmenefee
    groups:
      github-actions:
        patterns: ['*']
