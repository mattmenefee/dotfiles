name: Dotfiles CI

on: # yamllint disable-line rule:truthy
  pull_request:
    # The first three are the defaults; ready_for_review is not, and the job below skips drafts and
    # runs on it
    types: [opened, synchronize, reopened, ready_for_review]
  # On main, because its ruleset does not require a branch to be up to date before merging, so a
  # merge can land a tree that no pull request run linted
  schedule:
    - cron: '17 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    # A skipped job satisfies the required status check, which is safe only because a draft cannot
    # be merged
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # super-linter resolves the default branch at startup and exits fatally if neither main
          # nor origin/main is present. That check is unconditional, so the history is needed even
          # though VALIDATE_ALL_CODEBASE means nothing is ever diffed against it.
          fetch-depth: 0

      - name: Test the /ship-it scrubber
        # The file is not executable, so call it through bash
        run: bash .claude/skills/ship-it/scripts/test-scrub.sh

      - name: Test the /reflow block detector
        # The fixtures pin the block edges the helper's heuristics must keep, and ubuntu-latest
        # ships the python3 it runs on
        run: bash home/.claude/skills/reflow/scripts/test-unfilled-blocks.sh

      - name: Test teams-copy's Markdown to HTML conversion
        # --print-html skips the macOS clipboard, so the conversion runs on Linux
        run: bash test/test-teams-copy.sh

      - name: Lint teams-copy with Ruff
        # Super-linter routes an extensionless file by what `file` reports, and the `file` in its
        # image classifies this script as an HTML document, so its Ruff run never sees the file.
        # This runs the Ruff from super-linter's own image, which the runner pulls while setting up
        # the job, with the tag read from the step below, so the two Ruff runs cannot drift apart in
        # version or default rules. Both read the root .ruff.toml.
        run: |
          tag=$(sed -n 's|^ *uses: super-linter/super-linter/slim@\(v[0-9.]*\)$|\1|p' \
            .github/workflows/ci.yml)
          if [ -z "${tag}" ]; then
            echo "Found no super-linter/slim@ version in ci.yml; has the step changed shape?" >&2
            exit 1
          fi

          docker run --rm --volume "${PWD}:/w" --workdir /w --entrypoint ruff \
            "ghcr.io/super-linter/super-linter:slim-${tag}" \
            check --no-cache home/.local/bin/teams-copy

      - name: Test the /rebase scripts
        run: bash home/.claude/skills/rebase/scripts/test-rebase.sh

      - name: Check zsh syntax
        # Nothing else here checks this shell code. ShellCheck has no zsh dialect, and
        # super-linter never hands it these files anyway: a .zsh extension is routed to the
        # bash-exec and shfmt arrays but never to the one ShellCheck reads, .zshrc classifies as a
        # "zsh script" and reaches the same dead end, and the extensionless autoload functions
        # under home/.zsh/functions look like plain text and join no linter's list at all. So
        # `zsh -n` is the only syntax gate these files have. It parses without executing, which
        # also means it catches parse errors only, not undefined variables or missing commands.
        # ubuntu-latest does not ship zsh, hence the install.
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

          # Only the zsh files outside home/.zsh are listed. Everything under it is discovered,
          # since it is zsh by construction, so a file added there is covered without anyone
          # remembering to come back here. The anti-glob reasoning on the autoload line in
          # home/.zshrc does not apply — there a glob is dangerous because every fpath entry
          # becomes a live command name, so over-coverage is the hazard. For a syntax check it is
          # under-coverage that hurts, and parsing a file that did not need it costs nothing.
          files=(home/.zshrc home/.zprofile init.zsh)
          listed=${#files[@]}
          while IFS= read -r file; do files+=("${file}"); done < <(find home/.zsh -type f | sort)

          # If find returns nothing, the loop checks only the listed files and passes green while
          # skipping all of home/.zsh — the exact shape of the gap this step exists to close. Fail
          # loudly instead.
          if [ "${#files[@]}" -eq "${listed}" ]; then
            echo "Found no zsh files under home/.zsh; has the directory moved?" >&2
            exit 1
          fi

          failed=0
          for file in "${files[@]}"; do
            echo "::group::zsh -n ${file}"
            zsh -n "${file}" || failed=1
            echo "::endgroup::"
          done

          exit "${failed}"

      - name: Check the README's plugin table matches .zshrc
        run: |
          zshrc=$(sed -n 's/^plugins=(\(.*\))$/\1/p' home/.zshrc | tr ' ' '\n' | sort)

          readme=$(grep -oP '^\s*\| \[\K[a-z-]+(?=\]\[omz_)' README.md | sort)

          if [ -z "${zshrc}" ]; then
            echo "Found no plugins=() array in home/.zshrc; has the line changed shape?" >&2
            exit 1
          fi
          if [ -z "${readme}" ]; then
            echo "Found no [name][omz_*] rows in README.md; has the table changed shape?" >&2
            exit 1
          fi

          if ! diff <(echo "${zshrc}") <(echo "${readme}"); then
            echo "::error::plugins=() in home/.zshrc and the README's plugin table disagree." >&2
            echo "Above, < is in .zshrc only and > is in the README only." >&2
            exit 1
          fi

      - name: Run the linters
        uses: super-linter/super-linter/slim@v9.0.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          VALIDATE_ALL_CODEBASE: true # lint every file, not only the ones that changed
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true

          LINTER_RULES_PATH: /
