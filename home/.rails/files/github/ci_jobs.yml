lint:
  runs-on: ubuntu-latest
  env:
    RUBOCOP_CACHE_ROOT: tmp/rubocop
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Prepare RuboCop cache
      uses: actions/cache@v4
      env:
        DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
      with:
        path: ${{ env.RUBOCOP_CACHE_ROOT }}
        key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
        restore-keys: |
          rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

    - name: Lint code for consistent style
      run: bin/rubocop -f github

test:
  runs-on: ubuntu-latest

  services:
    postgres:
      image: postgres
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - 5432:5432
      options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

  steps:
    # Rails' ci_packages for this stack: the Dockerfile's build packages the runner lacks
    - name: Install packages
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips node-gyp

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: yarn

    - name: Install JavaScript packages
      run: yarn install --frozen-lockfile

    # db:test:prepare loads the schema, and spec:prepare builds the JavaScript and Sass bundles.
    # System specs tagged :js run in the runner's preinstalled Google Chrome.
    - name: Run tests
      env:
        RAILS_ENV: test
        DATABASE_URL: postgres://postgres:postgres@localhost:5432
      run: bin/rails db:test:prepare spec

    - name: Keep screenshots from failed system tests
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots
        path: ${{ github.workspace }}/tmp/screenshots
        if-no-files-found: ignore
