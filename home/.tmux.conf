# Advertise tmux's own terminfo. Programs then look up capabilities tmux actually implements; the
# common workaround of pointing this at `xterm-256color` promises xterm features tmux lacks, which
# is what produces stray escape sequences in vim and full-screen apps. tmux has defaulted to
# tmux-256color since 3.3, so this is a pin rather than a change. Truecolor is a separate capability
# the outer terminal has to be trusted for, so it is declared for that TERM specifically.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# How long tmux waits after an Escape to see whether more bytes follow (a real escape sequence)
# before forwarding it as a bare Esc. tmux has defaulted to 10ms since 3.5, but it spent years at
# 500ms — long enough to put a visible delay in front of every Esc, including the vi-mode keys
# below and Claude Code's interrupt. Pinned so an older tmux behaves the same as this one.
set -s escape-time 10

# Let vim and Claude Code see focus gain/loss so they can redraw or autosave on tab switches
set -g focus-events on

set -g history-limit 50000
set -g display-time 2000
set -g mouse on

# `external`, the default, copies tmux's buffer out to the terminal's clipboard over OSC 52 — the
# half that carries a yank back through SSH to the local clipboard, including an iPhone's. `on`
# would add the inbound direction, letting an application in a pane populate a tmux buffer; it is
# declined because any output rendered in a pane could then rewrite the clipboard silently, with no
# indication, and the poisoned paste lands in a shell or a commit message. Pinned so that stays off.
set -g set-clipboard external

# Permit escape sequences tmux does not understand to reach the outer terminal, wrapped in tmux's
# DCS passthrough. Only the directory half of the iTerm2 tab title in ~/.zsh/iterm2-tab-title.zsh
# needs this; the branch travels through `#T` and `set-titles-string` below. `on` rather than `all`
# is deliberate: passthrough then fires only for a visible pane, so a background pane's `cd` cannot
# overwrite the variable while another window is on screen. The cost is that the directory goes
# stale after a window switch until the newly visible pane draws its next prompt.
set -g allow-passthrough on

# Windows and panes count from 1: the 0 key sits past 9 on a keyboard, so a 0-indexed first window
# is the one furthest from the prefix. Renumbering keeps the sequence gapless after a close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Size each window to the smallest client *currently looking at it*, rather than to the smallest
# client attached to the session at all. This is what keeps a desktop window full-size while a
# phone is also attached to the same session but viewing something else. Both lines are needed:
# `aggressive-resize` is defined purely in terms of `window-size`'s `smallest`/`largest`, so on
# the default `latest` — every window sized to whichever client was last active — it does nothing.
setw -g window-size smallest
setw -g aggressive-resize on

# Match the shell's vi-mode plugin. tmux already infers this from $EDITOR, which is `mvim -v` here
# and so reads as vi — pinning it keeps copy mode from changing keys if $EDITOR ever does.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# `Escape` cancels outright rather than tmux's stock `clear-selection`. A deliberate divergence
# from vi: `y` already exits on the success path, so Escape is the abort path and abort means leave.
# The cost is that nothing clears a selection while staying in copy mode.
bind -T copy-mode-vi Escape send -X cancel

# Splits that keep the current directory, on keys shaped like the split they make. The defaults
# (% and ") are unbound rather than left as duplicates so there is one way to do it. `-` also takes
# over the default `delete-buffer`, which `prefix :` still reaches.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind %
unbind '"'

# Pane movement on vim's home row. This takes over the default prefix+l (last-window), which moves
# to prefix+Tab below.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# -r makes these repeat without re-pressing the prefix, so a pane can be dragged to size in one go.
# `L` takes over the default `switch-client -l`.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload. Takes over the default `refresh-client`, which a resize or a detach-and-reattach covers.
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Inside tmux the shell's own title sequences terminate at tmux, so without this the outer terminal
# title freezes at whatever was set before tmux started. `#T` is the active pane's title, which
# ~/.zsh/iterm2-tab-title.zsh sets to the git branch (or the running command) — republishing that
# unchanged keeps iTerm2 tabs reading as they do outside tmux, branch first. One difference: tmux
# writes the title with OSC 0 (its `tsl` capability), so inside tmux the window title is retitled
# too, which the OSC 1 path outside tmux deliberately avoids.
set -g set-titles on
set -g set-titles-string "#T"

# Status line: `bg=default` inherits the terminal background instead of painting a colored bar, so
# the bar sits on whatever background the profile uses. The foreground indices below are fixed
# 256-color values that assume a dark, gruvbox-ish palette. The current window is marked by weight
# and color rather than a highlight block, for the same reason. `#F` is kept in the window formats
# because it carries the flag indicators, `Z` among them — the only sign that a pane is zoomed.
set -g status-position bottom
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour109,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245] %-d %b  %-I:%M %p "
set -g status-right-length 30
setw -g window-status-format " #I #W#F "
setw -g window-status-current-format " #I #W#F "
setw -g window-status-current-style "fg=colour223,bold"
setw -g window-status-bell-style "fg=colour167,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour109"
set -g message-style "fg=colour223,bg=colour238"
