extends: default

rules:
  # Allow the single-space `# yamllint disable-line rule:truthy` form used in the CI workflow.
  comments:
    min-spaces-from-content: 1

  # Neither the GitHub workflow nor gh's generated ~/.config/gh/config.yml opens with `---`.
  document-start: disable

  # Match the 100 columns this repo wraps at everywhere else. Kept at warning level because
  # home/.config/gh/config.yml is generated by gh and carries comments we do not control.
  line-length:
    max: 100
    level: warning
